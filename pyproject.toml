[project]
name = "wheatwatch"
version = "0.1.0"
description = "Wheat drought early-warning map for Azerbaijan"
requires-python = ">=3.12"
dependencies = [
    "numpy",
    "pandas",
    "geopandas",
    "shapely",
    "rasterio",
    "pystac-client",
    "planetary-computer",
    "requests",
]

[project.optional-dependencies]
dev = ["pytest", "ruff", "black", "mypy", "pandas-stubs", "types-requests"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.black]
line-length = 100
target-version = ["py312"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
strict = true
python_version = "3.12"
mypy_path = "src"

[[tool.mypy.overrides]]
module = ["geopandas", "shapely.*", "rasterio", "rasterio.*", "planetary_computer", "pystac_client"]
ignore_missing_imports = true
